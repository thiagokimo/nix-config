name: Nix Flake CI

# Push-only: this public repository runs on a self-hosted runner (t14s), and a
# pull_request trigger would let a fork's code run on that machine.
on:
  push:
    branches:
      - main

jobs:
  check:
    name: Evaluate & Check Flake
    runs-on: [self-hosted, t14s]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Check Formatting
        run: nix fmt -- --check .

      - name: Evaluate Flake Checks
        run: nix flake check --no-build --extra-experimental-features "nix-command flakes"
